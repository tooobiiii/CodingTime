name: Release

# Tag a commit as `v<pluginVersion>` (matching gradle.properties) to publish that version,
# or trigger manually to push a build to a pre-release channel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew check

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      # The build reads credentials from the environment, so secrets must be mapped explicitly:
      # storing them in the `production` environment does not export them to the process.
      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: CodingTime ${{ github.ref_name }}
          files: build/distributions/*.zip
          generate_release_notes: true
