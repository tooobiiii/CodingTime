name: Release

# Tag a commit as `v<pluginVersion>` (matching gradle.properties) to publish that version,
# or trigger manually to push a build to a pre-release channel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew check

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Publish plugin
        run: ./gradlew publishPlugin -PintellijPublishToken=${{ secrets.PUBLISH_TOKEN }}

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: CodingTime ${{ steps.version.outputs.version }}
          files: build/distributions/*-signed.zip
          generate_release_notes: true
