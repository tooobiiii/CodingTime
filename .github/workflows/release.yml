name: Release

# Tag a commit as `v<pluginVersion>` (matching gradle.properties) to publish that version,
# or trigger manually to push a build to a pre-release channel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Marketplace release channel
        type: choice
        options: [default, beta, eap]
        default: default

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v6
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: plugin-verifier-${{ runner.os }}-

      # A tag that disagrees with gradle.properties would publish a version nobody expects,
      # and the Marketplace rejects re-uploads, so fail before anything leaves the runner.
      - name: Resolve and check version
        id: version
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [ -z "$version" ]; then
            echo "::error::pluginVersion is not set in gradle.properties"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match pluginVersion $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./gradlew check

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Publish plugin
        run: ./gradlew publishPlugin -PpluginChannel=${{ inputs.channel || 'default' }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: CodingTime ${{ steps.version.outputs.version }}
          files: build/distributions/*-signed.zip
          generate_release_notes: true
