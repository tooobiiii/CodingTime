# Single source of truth for the released plugin version. Release tags are `v<pluginVersion>`.
pluginVersion=1.0.1

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true

# The IntelliJ Platform ships kotlin-stdlib; bundling our own would clash with it.
kotlin.stdlib.default.dependency=false

# Opt out of the Gradle IntelliJ plugin's incompatible-plugin check noise.
org.jetbrains.intellij.platform.buildFeature.selfUpdateCheck=false
